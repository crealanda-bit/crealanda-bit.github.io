<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Landa</title>
    
    <!-- GOOGLE FONTS: GREAT VIBES EN HET SMALLE BEBAS NEUE DIRECT GEKOPPELD -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Great+Vibes&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        /* =================================================================
           BASE: STANDAARD INSTELLINGEN
           ================================================================= */
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #724058; 
            color: #FCF5EE; 
            transition: background-color 0.4s ease;
            perspective: 1000px; /* Vereist voor het 3D Swing Out effect */
        }
        .container { 
            padding: 20px 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .page { 
            display: none; 
            width: 100%;
            max-width: 600px;
        }
        .page.active { 
            display: block; 
        }

        /* =================================================================
           BANNER: VASTE BOVENBALK (KLEUR #9EB3D8)
           ================================================================= */
        .top-banner { 
            background-color: #9EB3D8; 
            color: #FCF5EE; 
            padding: 10px 15px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
            box-sizing: border-box;
        }
        .left-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .left-brand img {
            max-height: 44px; 
            width: auto;
            border-radius: 50%;
            object-fit: contain;
        }
        .logo-text {
            font-family: 'Great Vibes', cursive;
            font-size: 30px;
            color: #FCF5EE;
        }

        /* =================================================================
           ANIMATIES: JOUW DRY ANMATION STYLES
           ================================================================= */
        @keyframes plopOpen {
            0% { transform: scale(0.7); opacity: 0; }
            80% { transform: scale(1.03); } 
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes swingOutMenu {
            0% { transform: rotateX(-90deg); opacity: 0; transform-origin: top; }
            100% { transform: rotateX(0deg); opacity: 1; transform-origin: top; }
        }

        @keyframes pulseKnop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); filter: brightness(1.1); }
            100% { transform: scale(1); }
        }

        /* =================================================================
           MENU: 3 BOLLETJES (PULSE) EN LOSSE ZWEVENDE BUTTONS (SWING OUT)
           ================================================================= */
        #menu-toggle {
            display: none;
        }
        .menu-btn, .menu-link-btn, input, button {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }
        .menu-btn {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            padding: 10px;
        }
        .menu-btn .dot {
            width: 6px;
            height: 6px;
            background-color: #FCF5EE;
            border-radius: 50%;
        }
        
        /* Het uitschuifbare menu (Kleur #B32C43, loopt gelijk met welkomstvak) */
        .nav-menu {
            display: none;
            background-color: #B32C43 !important; 
            position: absolute;
            top: 60px; 
            right: 15px; 
            padding: 6px;
            min-width: 50px;
            z-index: 99;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        .menu-link-btn {
            display: block;
            background-color: transparent;
            color: #FCF5EE !important;
            padding: 8px 0;
            text-decoration: none;
            font-size: 24px; 
            text-align: center;
            cursor: pointer;
            border: none;
            width: 100%;
            box-sizing: border-box;
        }

        /* Geactiveerde menu-animaties */
        #menu-toggle:checked ~ .top-banner .menu-btn {
            animation: pulseKnop 0.4s ease-out; /* De Pulse op de 3 bolletjes */
        }
        #menu-toggle:checked ~ .container .nav-menu {
            display: block !important;
            animation: swingOutMenu 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; /* Swing Out */
        }

        /* =================================================================
           WELKOMSTVAK: KLEUR #9EB3D8 (PLOP-OPEN ANIMATIE)
           ================================================================= */
        .welcome-box {
            background-color: #9EB3D8;
            padding: 20px 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            text-align: center;
            box-sizing: border-box;
            width: 100%;
            animation: plopOpen 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; /* plopOpen */
        }
        .welcome-box p { 
            margin: 0; 
            font-family: 'Bebas Neue', Arial, sans-serif !important; 
            font-size: 24px !important; 
            letter-spacing: 0.8px;
            line-height: 1.35;
            color: #FCF5EE !important;
        }

        /* =================================================================
           WINKELMAND: KLEUR #9EB3D8 MET RANDEFFECT IN #6F4257
           ================================================================= */
        .cart-wrapper {
            background-color: #6F4257; /* De kleine randkleur rondom */
            padding: 4px; 
            border-radius: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        .cart-section { 
            background-color: #9EB3D8; 
            padding: 20px; 
            border-radius: 12px; /* Gematigd afgerond */
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            box-sizing: border-box;
            width: 100%;
            animation: plopOpen 0.4s ease-out forwards;
        }
        .cart-title-text {
            font-family: 'Great Vibes', cursive !important;
            font-size: 42px !important;
            font-weight: normal !important;
            text-align: center;
            padding: 5px 0 15px 0;
            color: #FCF5EE !important;
        }
        .shipping-section {
            font-family: 'Bebas Neue', Arial, sans-serif !important;
            font-size: 24px !important;
            color: #FCF5EE !important;
            letter-spacing: 0.8px;
        }
        .shipping-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        
        .shipping-section::after {
            content: "";
            display: block;
            border-top: 3px dashed #FCF5EE; 
            margin: 15px 0;
            width: 100%;
        }
        .total-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 28px !important; 
            font-weight: bold !important; 
        }

        /* =================================================================
           FORMULIER: LOSSE RODE VAKKEN (#B32C43) EN LICHTE INVOERVAKKEN (#FCF5EE)
           ================================================================= */
        .order-form-box { 
            margin-top: 25px; 
        }
        .form-row-group {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            width: 100%;
            gap: 10px;
        }
        .form-label-box {
            background-color: #B32C43;
            color: #FCF5EE !important;
            font-family: 'Bebas Neue', Arial, sans-serif !important;
            font-size: 20px;
            letter-spacing: 0.5px;
            padding: 12px;
            border-radius: 8px; 
            min-width: 110px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #FCF5EE;
        }
        .form-input-box {
            flex-grow: 1;
        }
        .form-input-box input {
            width: 100%;
            padding: 12px;
            background-color: #FCF5EE !important; /* Invoerveld kleur #FCF5EE */
            color: #B32C43 !important; /* Typ-tekst in contrasterend rood */
            border: 1px solid #FCF5EE !important;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: bold;
        }
        .form-input-box input::placeholder { color: rgba(179, 44, 67, 0.5) !important; }

        /* Bestelling plaatsen knop rechtsonder met De Pulse animatie */
        .btn-container { 
            display: flex; 
            justify-content: flex-end; 
            width: 100%; 
            margin-top: 20px; 
        }
        .btn-submit { 
            background-color: #B32C43; 
            color: #FCF5EE; 
            border: 1px solid #FCF5EE; 
            padding: 12px 25px; 
            border-radius: 8px; 
            cursor: pointer;
