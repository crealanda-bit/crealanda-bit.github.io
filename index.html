<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Landa</title>
    
    <!-- GOOGLE FONTS: GREAT VIBES EN HET NIEUWE BEBAS NEUE INLADEN -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Great+Vibes&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        /* BASE: BASISINSTELLINGEN EN STANDAARD ACHTERGROND */
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #724058; 
            color: #FCF5EE; 
            transition: background-color 0.4s ease; 
        }
        .container { 
            padding: 20px 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }
        .page { 
            display: none; 
            width: 100%;
            max-width: 600px;
        }
        .page.active { 
            display: block; 
        }

        /* BANNER: DE BLAUWE BOVENBALK DIE VAST BLIJFT STAAN */
        .top-banner { 
            background-color: #9EB3D8; 
            color: #FCF5EE; 
            padding: 10px 15px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
            box-sizing: border-box;
        }
        .left-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .left-brand img {
            max-height: 42px; 
            width: auto;
            border-radius: 50%;
        }
        .logo-text {
            font-family: 'Great Vibes', cursive;
            font-size: 30px;
            color: #FCF5EE;
        }

        /* ANIMATIES: JOUW OP-MAAT-GEMAAKTE BEWEGINGEN */
        @keyframes plopOpen {
            0% { transform: scale(0.7); opacity: 0; }
            80% { transform: scale(1.03); } 
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes glijdNaarBeneden {
            0% { transform: translateY(-15px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* MENU: DRIE BOLLETJES EN DE LOSSE ICOONTJES ZONDER ACHTERGRONDBANNER */
        #menu-toggle {
            display: none;
        }
        .menu-btn, .menu-link-btn, input, button {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }
        .menu-btn {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            padding: 10px;
            transition: transform 0.2s ease;
        }
        .menu-btn:active {
            transform: scale(0.85); 
        }
        .menu-btn .dot {
            width: 6px;
            height: 6px;
            background-color: #FCF5EE;
            border-radius: 50%;
        }
        
        /* De nav-menu banner achtergrond is volledig verwijderd. Transparant gemaakt! */
        .nav-menu {
            display: none;
            background-color: transparent !important; 
            position: absolute;
            top: 65px;
            right: 15px; /* Lijnt nu perfect uit met de rechterkant van je welkomstvak */
            padding: 0;
            min-width: 44px;
            z-index: 99;
            box-shadow: none !important;
        }
        
        /* Losse ronde paarse knopjes die onder elkaar zweven, zonder banner erachter */
        .menu-link-btn {
            display: block;
            background-color: #B32C43; /* Jouw paars-rode menukleur */
            color: #FCF5EE;
            padding: 0;
            margin: 0 0 10px 0;
            border-radius: 50%; 
            width: 44px;
            height: 44px;
            line-height: 44px;
            text-decoration: none;
            font-size: 22px; 
            border: 1px solid #FCF5EE;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .menu-link-btn:last-child {
            margin-bottom: 0;
        }
        .menu-link-btn:active {
            transform: scale(0.90); 
        }
        
        #menu-toggle:checked ~ .nav-menu {
            display: block !important;
            animation: glijdNaarBeneden 0.25s ease-out forwards;
        }

        /* WELKOMSTVAK: HET DESIGN IS NU GEKOPPELD AAN BEBAS NEUE */
        .welcome-box {
            background-color: #9EB3D8;
            padding: 20px 15px; 
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            text-align: center;
            box-sizing: border-box;
            width: 100%;
            animation: plopOpen 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .welcome-box p { 
            margin: 0; 
            font-family: 'Bebas Neue', Arial, sans-serif !important; /* Direct gekoppeld aan de werkende Bebas Neue look */
            font-size: 24px !important; 
            letter-spacing: 1px;
            line-height: 1.3;
            color: #FCF5EE !important;
            display: inline-block;
        }

        /* WINKELMAND: JOUW INSTELLINGEN VOOR DE BESTELPAGINA */
        .cart-section { 
            background-color: #9EB3D8; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            box-sizing: border-box;
            width: 100%;
            color: #FCF5EE !important;
            animation: plopOpen 0.4s ease-out forwards;
        }
        .cart-title-text {
            font-family: 'Great Vibes', cursive !important;
            font-size: 42px !important;
            font-weight: normal !important;
            text-align: center;
            padding: 5px;
            color: #FCF5EE !important;
        }
        .shipping-section {
            margin-top: 15px;
            padding: 10px 5px;
            font-family: 'Bebas Neue', Arial, sans-serif !important;
            font-size: 22px !important;
            color: #FCF5EE !important;
            letter-spacing: 0.8px;
        }
        .shipping-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .shipping-section::after {
            content: "";
            display: block;
            border-top: 3px dashed #FCF5EE; 
            margin: 15px 0;
            width: 100%;
        }
        .total-row { 
            display: flex; 
            justify-content: space-between; 
            font-family: 'Bebas Neue', Arial, sans-serif !important;
            font-size: 26px !important; 
            font-weight: bold !important; 
            color: #FCF5EE !important; 
            letter-spacing: 0.8px;
        }
        .order-form-box { margin-top: 15px; }
        .form-group { margin-bottom: 12px; font-family: 'Bebas Neue', Arial, sans-serif !important; font-size: 20px; color: #FCF5EE !important; letter-spacing: 0.5px; }
        .form-group label { display: block; margin-bottom: 6px; text-align: left; }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            background-color: #B32C43; 
            color: #FCF5EE !important; 
            border: 1px solid #FCF5EE !important; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
            transition: border-color 0.2s ease;
        }
        .form-group input:focus {
            border-color: #724058 !important; 
            outline: none;
        }
        .form-group input::placeholder { color: rgba(252, 245, 238, 0.6) !important; }
        .btn-container { display: flex; justify-content: flex-end; width: 100%; margin-top: 20px; }
        .btn-submit { background-color: #B32C43; color: #FCF5EE; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-family: 'Bebas Neue', Arial, sans-serif !important; font-size: 22px; font-weight: bold; letter-spacing: 0.8px; transition: transform 0.2s ease; }
        .btn-submit:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <!-- DE BANNER STRUCTUUR -->
    <div class="top-banner">
        <div class="left-brand">
            <img src="Naamloos - 03 oktober 2026 om 18.42.59 (1).png" alt="Logo">
            <div class="logo-text">Crea Landa</div>
        </div>
        
        <label for="menu-toggle" class="menu-btn">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </label>
    </div>

    <input type="checkbox" id="menu-toggle">

    <!-- JOUW COSTRUCTIE MET PURE EN ALLEEN ICOONTJES ONDER ELKAAR (BANNERVAK WEG!) -->
    <div class="nav-menu">
        <button class="menu-link-btn" onclick="gotoPage('home')">🏠</button>
        <button class="menu-link-btn" onclick="gotoPage('winkelmand')">🛒</button>
    </div>

    <div class="container">

        <!-- HOMEPAGE PAGINA -->
        <div id="homePage" class="page active">
            <div class="welcome-box">
                <p id="welcome-text-placeholder"></p>
            </div>
            <p style="text-align:center; margin-top: 40px; font-family:'Bebas Neue', Arial, sans-serif; font-size:20px; opacity:0.6; letter-spacing: 0.5px;">
                (Gebruik het menu rechtsboven om de winkelmand te bekijken)
            </p>
        </div>

        <!-- WINKELMAND PAGINA -->
        <div id="winkelmandPage" class="page">
            <div class="cart-section">
