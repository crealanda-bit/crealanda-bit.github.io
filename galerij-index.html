<section id="galerij" style="margin:24px 16px;">
  <style>
    #galerij h2 { text-align:center; color:#fff6ee; font-size:1.8rem; letter-spacing:1px; margin:0 0 16px; }
    #clGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
    .cl-card { margin:0; background:#9db3d9; border-radius:16px; overflow:hidden; position:relative;
      box-shadow:0 6px 18px rgba(0,0,0,.25);
      opacity:0; transform:translateY(40px) scale(.9);
      transition:opacity .6s ease, transform .6s cubic-bezier(.2,.9,.3,1.2); }
    .cl-card.show { opacity:1; transform:none; }
    .cl-card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
    .cl-card figcaption { padding:8px 12px 10px; color:#fff6ee; font-size:1.1rem; }
    .cl-card small { display:block; opacity:.85; }
    .cl-heart { position:absolute; top:8px; right:8px; border:0; border-radius:22px; padding:6px 12px;
      background:rgba(0,0,0,.5); color:#fff; font-size:1.1rem; cursor:pointer; transition:transform .15s; }
    .cl-heart.on { color:#ff5a7a; }
    .cl-heart.pop { animation:clPop .35s ease; }
    @keyframes clPop { 0%{transform:scale(1)} 40%{transform:scale(1.4)} 100%{transform:scale(1)} }
    @media (prefers-reduced-motion: reduce) { .cl-card { transition:none; opacity:1; transform:none; } }
  </style>

  <h2>Galerij</h2>
  <div id="clGrid"></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  const sb = supabase.createClient(
    'https://nyeedsxrlnkbxzoritwg.supabase.co',
    'sb_publishable_zjsw5kOIEZXbGszdm8T_jQ_CU6GHCC7'
  );
  const grid = document.getElementById('clGrid');

  function visitorId() {
    try {
      let v = localStorage.getItem('cl_visitor');
      if (!v) { v = crypto.randomUUID(); localStorage.setItem('cl_visitor', v); }
      return v;
    } catch (e) { return crypto.randomUUID(); }
  }
  const vid = visitorId();

  const observer = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) {
        e.target.classList.add('show');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });

  async function load() {
    const [p, c, m] = await Promise.all([
      sb.from('photos').select('*').order('created_at', { ascending: false }),
      sb.rpc('get_like_counts'),
      sb.rpc('get_my_likes', { p_visitor: vid })
    ]);
    if (p.error) return console.error(p.error);

    const counts = {};
    (c.data || []).forEach(r => { counts[r.pid] = Number(r.total); });
    const mine = new Set(m.data || []);

    grid.innerHTML = '';
    if (!p.data.length) {
      grid.textContent = 'Binnenkort komen hier foto\u2019s!';
      return;
    }

    p.data.forEach((ph, i) => {
      const fig = document.createElement('figure');
      fig.className = 'cl-card';
      fig.style.transitionDelay = ((i % 3) * 90) + 'ms';

      const img = document.createElement('img');
      img.src = sb.storage.from('photos').getPublicUrl(ph.storage_path).data.publicUrl;
      img.loading = 'lazy';
      img.alt = ph.title || '';

      let n = counts[ph.id] || 0;
      let liked = mine.has(ph.id);
      const btn = document.createElement('button');
      btn.className = 'cl-heart';
      const draw = () => {
        btn.textContent = (liked ? '\u2665 ' : '\u2661 ') + n;
        btn.classList.toggle('on', liked);
      };
      draw();

      btn.onclick = async () => {
        btn.disabled = true;
        const { data, error } = await sb.rpc('toggle_like', { p_photo: ph.id, p_visitor: vid });
        if (!error) {
          if (data && !liked) n += 1;
          if (!data && liked) n = Math.max(0, n - 1);
          liked = data;
          draw();
          btn.classList.remove('pop');
          void btn.offsetWidth;
          btn.classList.add('pop');
        }
        btn.disabled = false;
      };

      const cap = document.createElement('figcaption');
      cap.textContent = ph.title || '';
      const sm = document.createElement('small');
      sm.textContent = ph.description || '';
      cap.appendChild(sm);

      fig.append(img, btn, cap);
      grid.appendChild(fig);
      observer.observe(fig);
    });
  }
  load();
})();
</script>
