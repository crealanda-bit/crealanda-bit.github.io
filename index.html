<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Landa</title>
    
    <!-- DE KORTE EN STRANGE CANVA LETTERTYPEN DIRECT VAN GOOGLE -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Great+Vibes&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        /* =================================================================
           BASE: BASISINSTELLINGEN EN ACHTERGROND OP DE HOMEPAGE
           ================================================================= */
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #724058; 
            color: #FCF5EE; 
            transition: background-color 0.4s ease;
            perspective: 1000px; /* Nodig voor het 3D deurtjes-effect (Swing Out) */
        }
        .container { 
            padding: 20px 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .page { 
            display: none; 
            width: 100%;
            max-width: 600px;
        }
        .page.active { 
            display: block; 
        }

        /* =================================================================
           BANNER: DE BOVENBALK DIE ALTIJD EN OVERAL BLIJFT STAAN
           ================================================================= */
        .top-banner { 
            background-color: #9EB3D8; 
            color: #FCF5EE; 
            padding: 10px 15px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
            box-sizing: border-box;
        }
        .left-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* Jouw ronde logo, niet te klein maar net passend */
        .left-brand img {
            max-height: 44px; 
            width: auto;
            border-radius: 50%;
            object-fit: contain;
        }
        /* Crea Landa in Great Vibes lettertype */
        .logo-text {
            font-family: 'Great Vibes', cursive;
            font-size: 30px;
            color: #FCF5EE;
        }

        /* =================================================================
           ANIMATIES: JOUW OP-MAAT-GEMAAKTE BEWEGINGEN VIA CSS
           ================================================================= */
        /* De plopOpen animatie voor het welkomstvak en winkelmand */
        @keyframes plopOpen {
            0% { transform: scale(0.7); opacity: 0; }
            80% { transform: scale(1.03); } 
            100% { transform: scale(1); opacity: 1; }
        }

        /* De 3D Swing Out deurtjes-animatie */
        @keyframes swingOutMenu {
            0% { transform: rotateX(-90deg); opacity: 0; transform-origin: top; }
            100% { transform: rotateX(0deg); opacity: 1; transform-origin: top; }
        }

        /* De Pulse ademhaling voor de bolletjes en de verzendknop */
        @keyframes pulseKnop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); filter: brightness(1.1); }
            100% { transform: scale(1); }
        }

        /* =================================================================
           MENU: DE DRIE BOLLETJES MET RECHTE ZWEVENDE BUTTONS
           ================================================================= */
        #menu-toggle {
            display: none;
        }
        /* Haalt overal de lelijke blauwe selectierand op je Pixel weg */
        .menu-btn, .menu-link-btn, input, button {
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }
        .menu-btn {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            padding: 10px;
        }
        .menu-btn .dot {
            width: 6px;
            height: 6px;
            background-color: #FCF5EE;
            border-radius: 50%;
        }
        
        /* Het menuvakje (Zonder achtergrondbanner, knoppen zweven handig) */
        .nav-menu {
            display: none;
            background-color: transparent !important; 
            position: absolute;
            top: 60px; /* Loopt nu exact gelijk met de onderkant van de banner/welkomstvak */
            right: 15px; 
            padding: 0;
            min-width: 44px;
            z-index: 99;
        }
        .menu-link-btn {
            display: block;
            background-color: #B32C43; /* Gekleurd in #B32C43 */
            color: #FCF5EE; /* Icoontjes in 1 kleur #FCF5EE */
            padding: 0;
            margin: 5px 0 0 0;
            border-radius: 12px; /* Gematigd afgeronde hoeken */
            width: 44px;
            height: 44px;
            line-height: 44px;
            text-decoration: none;
            font-size: 22px; 
            border: 1px solid #FCF5EE;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        /* Geactiveerde animaties via de onzichtbare toggle */
        #menu-toggle:checked ~ .top-banner .menu-btn {
            animation: pulseKnop 0.4s ease-out; /* De Pulse op de 3 bolletjes */
        }
        #menu-toggle:checked ~ .nav-menu {
            display: block !important;
            animation: swingOutMenu 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; /* Swing Out */
        }

        /* =================================================================
           WELKOMSTVAK: HET LICHTBLAUWE VAK MET PLOPOPEN ANIMATIE
           ================================================================= */
        .welcome-box {
            background-color: #9EB3D8;
            padding: 20px 15px; 
            border-radius: 12px; /* Afgeronde hoeken, niet te rond */
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            text-align: center;
            box-sizing: border-box;
            width: 100%;
            animation: plopOpen 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; /* plopOpen */
        }
        .welcome-box p { 
            margin: 0; 
            font-family: 'Bebas Neue', Arial, sans-serif !important; /* Dwingend Bebas Neue */
            font-size: 24px !important; 
            letter-spacing: 0.8px;
            line-height: 1.35;
            color: #FCF5EE !important;
        }

        /* =================================================================
           WINKELMAND: MIJN BESTELLING IN JOUW CANVAS-KLEUREN
           ================================================================= */
        .cart-section { 
            background-color: #9EB3D8; /* Vak over de achtergrond heen */
            padding: 20px; 
            border-radius: 12px; /* Afgeronde hoeken, niet te rond */
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            box-sizing: border-box;
            width: 100%;
            animation: plopOpen 0.4s ease-out forwards;
        }
        /* Titel: Mijn Bestelling in het midden, Great Vibes, kleur #FCF5EE */
        .cart-title-text {
            font-family: 'Great Vibes', cursive !important;
            font-size: 42px !important;
            font-weight: normal !important;
            text-align: center;
            padding: 5px 0 15px 0;
            color: #FCF5EE !important;
        }
        /* Verzendtarieven en Totaalbedrag in Bebas Neue, kleur #FCF5EE */
        .shipping-section {
            font-family: 'Bebas Neue', Arial, sans-serif !important;
            font-size: 24px !important;
            color: #FCF5EE !important;
            letter-spacing: 0.8px;
        }
        .shipping-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        
        /* De stippellijn onder de verzendopties, kleur #FCF5EE */
        .shipping-section::after {
            content: "";
            display: block;
            border-top: 3px dashed #FCF5EE; 
            margin: 15px 0;
            width: 100%;
        }
        .total-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 28px !important; 
            font-weight: bold !important; 
        }

        /* =================================================================
           FORMULIER: STRUKTUUR VAN DE GEGEVENS-VAKKEN ONDER ELKAAR
           ================================================================= */
        .order-form-box { 
            margin-top: 25px; 
        }
        .form-row-group {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            width: 100%;
            gap: 10px;
        }
        /* Korte linker vakken voor de teksten, kleur #B32C43, Bebas Neue */
        .form-label-box {
            background-color: #B32C43;
            color: #FCF5EE !important;
            font-family: 'Bebas Neue', Arial, sans-serif !important;
            font-size: 20px;
            letter-spacing: 0.5px;
            padding: 12px;
            border-radius: 8px; /* Net afgeronde hoeken maar niet te */
            min-width: 110px;
            text-align: center;
            box-sizing: border-box;
            border: 1px solid #FCF5EE;
        }
        /* Rechter vakken waar ze in kunnen typen, kleur #B32C43, tekstkleur #FCF5EE */
        .form-input-box {
            flex-grow: 1;
        }
        .form-input-box input {
            width: 100%;
            padding: 12px;
