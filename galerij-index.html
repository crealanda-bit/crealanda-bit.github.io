<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beheer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Great+Vibes&display=swap');
:root { --blue: #9EB3D8; --cream: #FCF5EE; --red: #B32C43; --plum: #6F4257; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
margin: 0;
padding: 20px 14px 40px;
background: var(--plum);
color: var(--cream);
font-family: "Bebas Neue", sans-serif;
font-size: 20px;
}
h1 {
margin: 0 0 18px;
text-align: center;
font-family: "Great Vibes", cursive;
font-size: clamp(44px, 9vw, 64px);
font-weight: 400;
color: var(--cream);
}
.sec-title {
margin: 30px 0 16px;
text-align: center;
font-family: "Great Vibes", cursive;
font-size: 42px;
font-weight: 400;
color: var(--cream);
}
.hidden { display: none !important; }
.box {
max-width: 520px;
margin: 0 auto 28px;
padding: 22px;
border-radius: 10px;
background: var(--blue);
box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
#admin { display: none; }
.box h3 {
margin: 0 0 14px;
text-align: center;
font-family: "Great Vibes", cursive;
font-size: 42px;
font-weight: 400;
color: var(--cream);
}
.box input, .box select {
display: block;
width: 100%;
margin: 0 0 10px;
padding: 12px;
border: 1px solid var(--red);
border-radius: 7px;
background: var(--blue);
color: var(--cream);
caret-color: var(--cream);
font: inherit;
font-size: 19px;
}
.box select option { color: #222; background: #fff; }
.box input::placeholder { color: var(--cream); opacity: .8; }
.box input:focus, .box select:focus { outline: 2px solid var(--cream); outline-offset: 2px; }
.box input[type="file"]::file-selector-button {
margin-right: 12px;
padding: 8px 14px;
border: 0;
border-radius: 6px;
background: var(--red);
color: var(--cream);
font: inherit;
cursor: pointer;
}
.box button {
display: block;
width: 100%;
margin: 8px 0 0;
padding: 13px;
border: 0;
border-radius: 8px;
background: var(--red);
color: var(--cream);
font: inherit;
font-size: 23px;
cursor: pointer;
}
.box button:disabled { opacity: .6; }
.box button:active { transform: scale(.98); }
.box #logoutBtn {
background: transparent;
border: 2px solid var(--cream);
}
.msg {
min-height: 1.2em;
margin: 14px 0 0;
text-align: center;
color: var(--cream);
font-size: 20px;
}
.grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
gap: 18px;
max-width: 1080px;
margin: 0 auto;
}
figure {
margin: 0;
overflow: hidden;
border-radius: 16px;
background: var(--blue);
box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
figure img {
display: block;
width: 100%;
aspect-ratio: 4 / 3;
object-fit: cover;
}
figcaption {
padding: 10px 14px 6px;
color: var(--cream);
}
.cap-title {
display: block;
font-family: "Great Vibes", cursive;
font-size: 1.4rem;
line-height: 1.2;
color: var(--cream);
}
figcaption small {
display: block;
margin-top: 4px;
font-family: "Bebas Neue", sans-serif;
font-size: 1.15rem;
letter-spacing: .3px;
color: var(--cream);
}
.cap-price {
display: block;
margin-top: 4px;
font-size: 1.25rem;
color: var(--cream);
}
.actions, .edit-box { padding: 8px 14px 14px; }
.actions { display: flex; gap: 10px; }
.act-btn {
flex: 1;
padding: 10px;
border: 0;
border-radius: 8px;
background: var(--red);
color: var(--cream);
font-family: "Bebas Neue", sans-serif;
font-size: 20px;
cursor: pointer;
}
.act-btn.ghost { background: transparent; border: 2px solid var(--cream); }
.act-btn:disabled { opacity: .6; }
.edit-box input {
display: block;
width: 100%;
margin: 0 0 8px;
padding: 10px;
border: 1px solid var(--red);
border-radius: 7px;
background: var(--blue);
color: var(--cream);
caret-color: var(--cream);
font-family: "Bebas Neue", sans-serif;
font-size: 19px;
}
.edit-box input::placeholder { color: var(--cream); opacity: .8; }
.edit-box input:focus { outline: 2px solid var(--cream); outline-offset: 2px; }
.edit-box .row { display: flex; gap: 10px; }
</style>
</head>
<body>
<h1>Beheer</h1>
<section id="admin" class="box">
<form id="loginForm">
<h3>Inloggen</h3>
<input id="email" type="email" placeholder="E-mail" required>
<input id="password" type="password" placeholder="Wachtwoord" required>
<button type="submit">Inloggen</button>
</form>
<form id="uploadForm" class="hidden">
<h3>Foto uploaden</h3>
<select id="uPage">
<option value="galerij">Galerij (beginpagina)</option>
<option value="kaarten">Handgemaakte kaarten (product)</option>
</select>
<input id="file" type="file" accept="image/*" required>
<input id="title" type="text" placeholder="Titel">
<input id="description" type="text" placeholder="Beschrijving">
<div id="productFields" hidden>
<input id="uGrams" type="text" inputmode="numeric" placeholder="Gewicht in gram (bijvoorbeeld 120)">
<input id="uPrice" type="text" inputmode="decimal" placeholder="Prijs (bijvoorbeeld 3,50)">
</div>
<button type="submit">Uploaden</button>
<button type="button" id="logoutBtn">Uitloggen</button>
</form>
<p id="msg" class="msg"></p>
</section>
<section id="productSection" hidden>
<h2 class="sec-title">Producten</h2>
<div class="grid" id="productGrid"></div>
<p id="pMsg" class="msg"></p>
</section>
<h2 class="sec-title">Galerij</h2>
<div class="grid" id="gallery"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://nyeedsxrlnkbxzoritwg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_zjsw5kOIEZXbGszdm8T_jQ_CU6GHCC7';
const BUCKET = 'photos';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);
const say = (t) => ($('msg').textContent = t);
const pSay = (t) => ($('pMsg').textContent = t);
let currentSession = null;
let firstLoad = true;
const euro = (n) => new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' }).format(Number(n) || 0);
function parsePrice(v) {
const n = parseFloat(String(v).trim().replace(',', '.'));
return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
}
function parseGrams(v) {
const g = parseInt(String(v).replace(/\D/g, ''), 10);
return g > 0 ? g : null;
}
function publicUrl(path) {
return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
function makeBtn(text, extraClass) {
const b = document.createElement('button');
b.type = 'button';
b.className = 'act-btn' + (extraClass ? ' ' + extraClass : '');
b.textContent = text;
return b;
}
function makeInput(value, placeholder) {
const i = document.createElement('input');
i.type = 'text';
i.value = value || '';
i.placeholder = placeholder;
return i;
}
/* ---------- Galerij-foto's ---------- */
function openEdit(p, fig) {
const cap = fig.querySelector('figcaption');
const act = fig.querySelector('.actions');
cap.hidden = true;
act.hidden = true;
const box = document.createElement('div');
box.className = 'edit-box';
const t = makeInput(p.title, 'Titel');
const d = makeInput(p.description, 'Beschrijving');
const row = document.createElement('div');
row.className = 'row';
const save = makeBtn('Opslaan');
const cancel = makeBtn('Annuleren', 'ghost');
row.append(save, cancel);
box.append(t, d, row);
cancel.onclick = () => { box.remove(); cap.hidden = false; act.hidden = false; };
save.onclick = async () => {
save.disabled = true;
const { data, error } = await db.from('photos')
.update({ title: t.value, description: d.value })
.eq('id', p.id)
.select();
if (error || !data || !data.length) {
save.disabled = false;
alert('Opslaan mislukt: ' + (error ? error.message : 'geen rechten'));
return;
}
p.title = data[0].title;
p.description = data[0].description;
cap.querySelector('.cap-title').textContent = p.title || '';
cap.querySelector('small').textContent = p.description || '';
box.remove();
cap.hidden = false;
act.hidden = false;
say('Opgeslagen.');
};
fig.appendChild(box);
t.focus();
}
async function removePhoto(p, btn) {
if (!confirm('Weet je zeker dat je deze foto wilt verwijderen? Dit kan niet ongedaan worden gemaakt.')) return;
btn.disabled = true;
const { data, error } = await db.from('photos').delete().eq('id', p.id).select();
if (error || !data || !data.length) {
btn.disabled = false;
alert('Verwijderen mislukt: ' + (error ? error.message : 'geen rechten'));
return;
}
const { data: removed, error: stErr } = await db.storage.from(BUCKET).remove([p.storage_path]);
if (stErr || !removed || !removed.length) {
say('Foto is van de site gehaald, maar het bestand bleef in de opslag staan.');
} else {
say('Foto verwijderd.');
}
loadGallery();
}
function buildCard(p) {
const fig = document.createElement('figure');
const img = document.createElement('img');
img.src = publicUrl(p.storage_path);
img.loading = 'lazy';
img.alt = p.title || '';
const cap = document.createElement('figcaption');
const title = document.createElement('span');
title.className = 'cap-title';
title.textContent = p.title || '';
const small = document.createElement('small');
small.textContent = p.description || '';
cap.append(title, small);
fig.append(img, cap);
if (currentSession) {
const act = document.createElement('div');
act.className = 'actions';
const editBtn = makeBtn('Aanpassen');
const delBtn = makeBtn('Verwijderen', 'ghost');
editBtn.onclick = () => openEdit(p, fig);
delBtn.onclick = () => removePhoto(p, delBtn);
act.append(editBtn, delBtn);
fig.appendChild(act);
}
return fig;
}
async function loadGallery() {
const { data, error } = await db.from('photos').select('*').order('created_at', { ascending: false });
if (error) return say('Foto\u2019s laden mislukt: ' + error.message);
$('gallery').innerHTML = '';
for (const p of data) $('gallery').appendChild(buildCard(p));
}
/* ---------- Producten ---------- */
function fallbackFile(file) {
return { blob: file, ext: (file.name.split('.').pop() || 'jpg').toLowerCase(), type: file.type || 'image/jpeg' };
}
// Verkleint de foto zodat de pagina snel laadt
function compressImage(file, maxSide, quality) {
return new Promise((resolve) => {
const url = URL.createObjectURL(file);
const img = new Image();
img.onload = () => {
try {
let w = img.naturalWidth, h = img.naturalHeight;
const scale = Math.min(1, maxSide / Math.max(w, h));
w = Math.round(w * scale);
h = Math.round(h * scale);
const c = document.createElement('canvas');
c.width = w;
c.height = h;
c.getContext('2d').drawImage(img, 0, 0, w, h);
c.toBlob((b) => {
URL.revokeObjectURL(url);
resolve(b ? { blob: b, ext: 'jpg', type: 'image/jpeg' } : fallbackFile(file));
}, 'image/jpeg', quality);
} catch (e) {
URL.revokeObjectURL(url);
resolve(fallbackFile(file));
}
};
img.onerror = () => { URL.revokeObjectURL(url); resolve(fallbackFile(file)); };
img.src = url;
});
}
function productFiles(p) {
return [p.photo].concat(p.photos || []).filter(Boolean);
}
function openProductEdit(p, fig) {
const cap = fig.querySelector('figcaption');
const act = fig.querySelector('.actions');
cap.hidden = true;
act.hidden = true;
const box = document.createElement('div');
box.className = 'edit-box';
const t = makeInput(p.title, 'Titel');
const d = makeInput(p.description, 'Beschrijving');
const g = makeInput(p.grams ? String(p.grams) : '', 'Gewicht in gram');
g.inputMode = 'numeric';
const pr = makeInput(String(p.price).replace('.', ','), 'Prijs (bijvoorbeeld 3,50)');
pr.inputMode = 'decimal';
const row = document.createElement('div');
row.className = 'row';
const save = makeBtn('Opslaan');
const cancel = makeBtn('Annuleren', 'ghost');
row.append(save, cancel);
box.append(t, d, g, pr, row);
cancel.onclick = () => { box.remove(); cap.hidden = false; act.hidden = false; };
save.onclick = async () => {
const grams = parseGrams(g.value);
const price = parsePrice(pr.value);
if (!t.value.trim()) return alert('Vul een titel in.');
if (grams === null) return alert('Vul het gewicht in gram in, bijvoorbeeld 120.');
if (price === null) return alert('Vul een geldige prijs in, bijvoorbeeld 3,50.');
save.disabled = true;
const { data, error } = await db.from('products')
.update({ title: t.value.trim(), description: d.value.trim(), grams: grams, price: price })
.eq('id', p.id)
.select();
if (error || !data || !data.length) {
save.disabled = false;
alert('Opslaan mislukt: ' + (error ? error.message : 'geen rechten'));
return;
}
p.title = data[0].title;
p.description = data[0].description;
p.grams = data[0].grams;
p.price = data[0].price;
cap.querySelector('.cap-title').textContent = p.title || '';
cap.querySelector('small').textContent = p.description || '';
cap.querySelector('.cap-price').textContent = p.grams + ' gram \u00b7 ' + euro(p.price);
box.remove();
cap.hidden = false;
act.hidden = false;
pSay('Opgeslagen.');
};
fig.appendChild(box);
t.focus();
}
async function removeProduct(p, btn) {
if (!confirm('Weet je zeker dat je dit product wilt verwijderen? Dit kan niet ongedaan worden gemaakt.')) return;
btn.disabled = true;
const { data, error } = await db.from('products').delete().eq('id', p.id).select();
if (error || !data || !data.length) {
btn.disabled = false;
alert('Verwijderen mislukt: ' + (error ? error.message : 'geen rechten'));
return;
}
const files = productFiles(p);
if (files.length) {
const { data: removed, error: stErr } = await db.storage.from(BUCKET).remove(files);
if (stErr || !removed || removed.length < files.length) {
pSay('Product verwijderd, maar het foto-bestand bleef in de opslag staan.');
} else {
pSay('Product verwijderd.');
}
} else {
pSay('Product verwijderd.');
}
loadProducts();
}
function buildProductCard(p) {
const fig = document.createElement('figure');
const files = productFiles(p);
if (files.length) {
const img = document.createElement('img');
img.src = publicUrl(files[0]);
img.loading = 'lazy';
img.alt = p.title || '';
fig.appendChild(img);
}
const cap = document.createElement('figcaption');
const title = document.createElement('span');
title.className = 'cap-title';
title.textContent = p.title || '';
const small = document.createElement('small');
small.textContent = p.description || '';
const price = document.createElement('span');
price.className = 'cap-price';
price.textContent = (p.grams ? p.grams + ' gram \u00b7 ' : '') + euro(p.price);
cap.append(title, small, price);
fig.appendChild(cap);
const act = document.createElement('div');
act.className = 'actions';
const editBtn = makeBtn('Aanpassen');
const delBtn = makeBtn('Verwijderen', 'ghost');
editBtn.onclick = () => openProductEdit(p, fig);
delBtn.onclick = () => removeProduct(p, delBtn);
act.append(editBtn, delBtn);
fig.appendChild(act);
return fig;
}
async function loadProducts() {
const { data, error } = await db.from('products').select('*').order('created_at', { ascending: false });
if (error) return pSay('Producten laden mislukt: ' + error.message);
$('productGrid').innerHTML = '';
for (const p of data) $('productGrid').appendChild(buildProductCard(p));
}
/* ---------- Uploaden ---------- */
function applyPageChoice() {
$('productFields').hidden = $('uPage').value !== 'kaarten';
}
$('uPage').addEventListener('change', applyPageChoice);
applyPageChoice();
async function uploadGalleryPhoto(file) {
say('Bezig met uploaden...');
const ext = file.name.split('.').pop();
const path = crypto.randomUUID() + '.' + ext;
const { error: upErr } = await db.storage.from(BUCKET).upload(path, file, { contentType: file.type });
if (upErr) return say('Upload mislukt: ' + upErr.message);
const { error: dbErr } = await db.from('photos').insert({
storage_path: path,
title: $('title').value,
description: $('description').value,
});
if (dbErr) return say('Opslaan metadata mislukt: ' + dbErr.message);
say('Gelukt! De foto staat in de galerij.');
const keep = $('uPage').value;
$('uploadForm').reset();
$('uPage').value = keep;
applyPageChoice();
loadGallery();
}
async function uploadProduct(file) {
const title = $('title').value.trim();
const grams = parseGrams($('uGrams').value);
const price = parsePrice($('uPrice').value);
if (!title) return say('Vul een titel in.');
if (grams === null) return say('Vul het gewicht in gram in, bijvoorbeeld 120.');
if (price === null) return say('Vul een geldige prijs in, bijvoorbeeld 3,50.');
say('Bezig met uploaden...');
let path = null;
let inserted = false;
try {
const { blob, ext, type } = await compressImage(file, 1600, 0.85);
path = 'products/' + crypto.randomUUID() + '.' + ext;
const { error } = await db.storage.from(BUCKET).upload(path, blob, { contentType: type });
if (error) throw new Error('Upload mislukt: ' + error.message);
const { error: dbErr } = await db.from('products').insert({
category: 'kaarten',
title: title,
description: $('description').value.trim(),
grams: grams,
price: price,
photo: path
});
if (dbErr) throw new Error('Opslaan mislukt: ' + dbErr.message);
inserted = true;
say('Gelukt! Het product staat op de pagina Handgemaakte Kaarten.');
const keep = $('uPage').value;
$('uploadForm').reset();
$('uPage').value = keep;
applyPageChoice();
} catch (err) {
if (!inserted && path) await db.storage.from(BUCKET).remove([path]);
say(err.message);
}
if (inserted) loadProducts();
}
$('uploadForm').addEventListener('submit', async (e) => {
e.preventDefault();
const file = $('file').files[0];
if (!file) return;
const submitBtn = $('uploadForm').querySelector('button[type="submit"]');
submitBtn.disabled = true;
try {
if ($('uPage').value === 'kaarten') await uploadProduct(file);
else await uploadGalleryPhoto(file);
} finally {
submitBtn.disabled = false;
}
});
/* ---------- Inloggen en zichtbaarheid ---------- */
function updateVisibility() {
const onAdmin = location.hash === '#admin';
$('admin').style.display = onAdmin ? 'block' : 'none';
$('productSection').hidden = !(onAdmin && currentSession);
}
window.addEventListener('hashchange', updateVisibility);
function applySession(session) {
const wasLoggedIn = !!currentSession;
currentSession = session;
$('loginForm').classList.toggle('hidden', !!session);
$('uploadForm').classList.toggle('hidden', !session);
updateVisibility();
if (firstLoad || wasLoggedIn !== !!session) {
firstLoad = false;
loadGallery();
if (session) loadProducts(); else $('productGrid').innerHTML = '';
}
}
updateVisibility();
db.auth.getSession().then(({ data }) => applySession(data.session));
db.auth.onAuthStateChange((_e, session) => applySession(session));
$('loginForm').addEventListener('submit', async (e) => {
e.preventDefault();
const { error } = await db.auth.signInWithPassword({
email: $('email').value,
password: $('password').value,
});
say(error ? 'Inloggen mislukt: ' + error.message : 'Ingelogd.');
});
$('logoutBtn').addEventListener('click', () => db.auth.signOut());
</script>
</body>
</html>
