<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beheer galerij</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Great+Vibes&display=swap');

:root { --blue: #9EB3D8; --cream: #FCF5EE; --red: #B32C43; --plum: #6F4257; }

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 14px 40px;
  background: var(--plum);
  color: var(--cream);
  font-family: "Bebas Neue", sans-serif;
  font-size: 20px;
}

h1 {
  margin: 0 0 18px;
  text-align: center;
  font-family: "Great Vibes", cursive;
  font-size: clamp(44px, 9vw, 64px);
  font-weight: 400;
  color: var(--cream);
}

.hidden { display: none !important; }

#admin {
  display: none;
  max-width: 520px;
  margin: 0 auto 28px;
  padding: 22px;
  border-radius: 10px;
  background: var(--blue);
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
}

#admin h3 {
  margin: 0 0 14px;
  text-align: center;
  font-family: "Great Vibes", cursive;
  font-size: 42px;
  font-weight: 400;
  color: var(--cream);
}

#admin input {
  display: block;
  width: 100%;
  margin: 0 0 10px;
  padding: 12px;
  border: 1px solid var(--red);
  border-radius: 7px;
  background: var(--blue);
  color: var(--cream);
  caret-color: var(--cream);
  font: inherit;
  font-size: 19px;
}

#admin input::placeholder { color: var(--cream); opacity: .8; }
#admin input:focus { outline: 2px solid var(--cream); outline-offset: 2px; }

#admin input[type="file"]::file-selector-button {
  margin-right: 12px;
  padding: 8px 14px;
  border: 0;
  border-radius: 6px;
  background: var(--red);
  color: var(--cream);
  font: inherit;
  cursor: pointer;
}

#admin button {
  display: block;
  width: 100%;
  margin: 8px 0 0;
  padding: 13px;
  border: 0;
  border-radius: 8px;
  background: var(--red);
  color: var(--cream);
  font: inherit;
  font-size: 23px;
  cursor: pointer;
}

#admin button:active { transform: scale(.98); }

#admin #logoutBtn {
  background: transparent;
  border: 2px solid var(--cream);
}

#msg {
  min-height: 1.2em;
  margin: 14px 0 0;
  text-align: center;
  color: var(--cream);
  font-size: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 18px;
  max-width: 1080px;
  margin: 0 auto;
}

figure {
  margin: 0;
  overflow: hidden;
  border-radius: 16px;
  background: var(--blue);
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
}

figure img {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
}

figcaption {
  padding: 10px 14px 14px;
  font-family: "Great Vibes", cursive;
  font-size: 1.4rem;
  line-height: 1.2;
  color: var(--cream);
}

figcaption small {
  display: block;
  margin-top: 4px;
  font-family: "Bebas Neue", sans-serif;
  font-size: 1.15rem;
  letter-spacing: .3px;
  color: var(--cream);
}
</style>
</head>
<body>

<h1>Beheer galerij</h1>

<section id="admin">
  <form id="loginForm">
    <h3>Inloggen</h3>
    <input id="email" type="email" placeholder="E-mail" required>
    <input id="password" type="password" placeholder="Wachtwoord" required>
    <button type="submit">Inloggen</button>
  </form>

  <form id="uploadForm" class="hidden">
    <h3>Foto uploaden</h3>
    <input id="file" type="file" accept="image/*" required>
    <input id="title" type="text" placeholder="Titel">
    <input id="description" type="text" placeholder="Beschrijving">
    <button type="submit">Uploaden</button>
    <button type="button" id="logoutBtn">Uitloggen</button>
  </form>
  <p id="msg"></p>
</section>

<div class="grid" id="gallery"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://nyeedsxrlnkbxzoritwg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_zjsw5kOIEZXbGszdm8T_jQ_CU6GHCC7';
  const BUCKET = 'photos';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  const say = (t) => ($('msg').textContent = t);

  async function loadGallery() {
    const { data, error } = await db.from('photos').select('*').order('created_at', { ascending: false });
    if (error) return console.error(error);
    $('gallery').innerHTML = '';
    for (const p of data) {
      const url = db.storage.from(BUCKET).getPublicUrl(p.storage_path).data.publicUrl;
      const fig = document.createElement('figure');
      const img = document.createElement('img');
      img.src = url; img.loading = 'lazy'; img.alt = p.title || '';
      const cap = document.createElement('figcaption');
      cap.textContent = p.title || '';
      const small = document.createElement('small');
      small.textContent = p.description || '';
      cap.appendChild(small);
      fig.append(img, cap);
      $('gallery').appendChild(fig);
    }
  }

  function checkHash() {
    $('admin').style.display = location.hash === '#admin' ? 'block' : 'none';
  }
  window.addEventListener('hashchange', checkHash);
  checkHash();

  function showState(session) {
    $('loginForm').classList.toggle('hidden', !!session);
    $('uploadForm').classList.toggle('hidden', !session);
  }
  db.auth.getSession().then(({ data }) => showState(data.session));
  db.auth.onAuthStateChange((_e, session) => showState(session));

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const { error } = await db.auth.signInWithPassword({
      email: $('email').value,
      password: $('password').value,
    });
    say(error ? 'Inloggen mislukt: ' + error.message : 'Ingelogd.');
  });

  $('logoutBtn').addEventListener('click', () => db.auth.signOut());

  $('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const file = $('file').files[0];
    if (!file) return;
    say('Bezig met uploaden...');

    const ext = file.name.split('.').pop();
    const path = `${crypto.randomUUID()}.${ext}`;

    const { error: upErr } = await db.storage.from(BUCKET).upload(path, file, { contentType: file.type });
    if (upErr) return say('Upload mislukt: ' + upErr.message);

    const { error: dbErr } = await db.from('photos').insert({
      storage_path: path,
      title: $('title').value,
      description: $('description').value,
    });
    if (dbErr) return say('Opslaan metadata mislukt: ' + dbErr.message);

    say('Gelukt!');
    $('uploadForm').reset();
    loadGallery();
  });

  loadGallery();
</script>
</body>
</html>
