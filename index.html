<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Landa</title>
    <!-- FontAwesome toevoegen voor het winkelmandje-icoon -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* Basisstijlen in de kleuren van Crea Landa */
        :root {
            --bg-purple: #704461;    /* De paarse achtergrondkleur van de site */
            --navbar-blue: #9cb1d9;  /* De lichtblauwe kleur van de bovenbalk */
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg-purple);
            color: var(--text-white);
        }

        /* Navigatiebalk */
        .navbar {
            background-color: var(--navbar-blue);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .brand-title {
            font-family: 'Georgia', cursive, serif;
            font-size: 24px;
            color: var(--text-white);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Schattig winkelmandje knop */
        .cart-btn {
            background: none;
            border: none;
            color: var(--bg-purple); /* Het mandje krijgt de paarse kleur */
            font-size: 22px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }

        .cart-btn:hover {
            transform: scale(1.1); /* Subtiel animatie-effect bij hover */
        }

        /* Drie puntjes menu */
        .menu-dots {
            color: var(--text-white);
            font-size: 22px;
            cursor: pointer;
        }

        /* Winkelmandje Overlay / Modaal Venster */
        .cart-modal {
            display: none; /* Standaard verborgen */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--bg-purple);
            border: 3px solid var(--navbar-blue);
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: var(--navbar-blue);
            font-size: 24px;
            cursor: pointer;
        }

        .modal-title {
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--navbar-blue);
            padding-bottom: 10px;
        }

        .empty-msg {
            font-style: italic;
            margin-bottom: 20px;
            color: #e0d0cc;
        }

        /* Aanmeldformulier in het mandje */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 14px;
            color: var(--navbar-blue);
        }

        .form-group input {
            padding: 10px;
            border: 2px solid var(--navbar-blue);
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }

        .form-group input::placeholder {
            color: #ccc;
        }

        .submit-btn {
            background-color: var(--navbar-blue);
            color: var(--bg-purple);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #b0c4de;
        }
    </style>
</head>
<body>

    <!-- Navigatiebalk -->
    <header class="navbar">
        <div class="brand-title">Crea Landa</div>
        <div class="nav-actions">
            <!-- Schattig winkelmandje links naast de 3 puntjes -->
            <button class="cart-btn" id="openCart" title="Winkelmandje">
                <i class="fas fa-shopping-basket"></i> <!-- Schattig mandje-icoon -->
            </button>
            <!-- De 3 puntjes -->
            <div class="menu-dots">
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </div>
    </header>

    <!-- Het Winkelmandje Scherm (Pop-up) -->
    <div class="cart-modal" id="cartModal">
        <div class="modal-content">
            <span class="close-btn" id="closeCart">&times;</span>
            <div class="modal-title">🛍️ Mijn Winkelmandje</div>
            
            <!-- Status van het mandje -->
            <p class="empty-msg" id="cartStatus">Je winkelmandje is momenteel nog leeg.</p>

            <!-- Aanmeldformulier -->
            <form class="login-form" id="checkoutForm">
                <div class="form-group">
                    <label for="name">Naam:</label>
                    <input type="text" id="name" placeholder="Vul je naam in" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mailadres:</label>
                    <input type="email" id="email" placeholder="Vul je e-mailadres in" required>
                </div>
                <button type="submit" class="submit-btn">Aanmelden & Verder</button>
            </form>
        </div>
    </div>

    <script>
        // JavaScript om de pop-up te openen en te sluiten
        const modal = document.getElementById('cartModal');
        const openBtn = document.getElementById('openCart');
        const closeBtn = document.getElementById('closeCart');
        const form = document.getElementById('checkoutForm');
        const statusText = document.getElementById('cartStatus');

        // Openen bij klik op het mandje
        openBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        // Sluiten bij klik op het kruisje
        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Sluiten als je buiten het venster klikt
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Formulier afhandeling (simulatie voor vullen met producten later)
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            
            // Verander de tekst zodra er is ingelogd/aangemeld
            statusText.innerText = `Welkom terug, ${name}! Je mandje wordt nu geladen met producten...`;
            form.style.display = 'none'; // Verberg het formulier na succesvol invullen
        });
    </script>
</body>
</html>
