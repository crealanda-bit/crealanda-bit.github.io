<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Landa</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Great+Vibes&family=Big+Shoulders+Display:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #724058; 
            color: #FCF5EE; 
        }

        .container { 
            padding: 20px 15px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        
        .page { 
            display: none; 
            width: 100%;
            max-width: 600px;
        }
        .page.active { 
            display: block; 
        }

        .top-banner { 
            background-color: #9EB3D8; 
            color: #FCF5EE; 
            padding: 10px 15px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            height: 60px;
            box-sizing: border-box;
        }

        .left-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .left-brand img {
            max-height: 42px; 
            width: auto;
            border-radius: 50%;
        }

        .logo-text {
            font-family: 'Great Vibes', cursive;
            font-size: 30px;
            color: #FCF5EE;
        }

        #menu-toggle {
            display: none;
        }

        .menu-btn {
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            padding: 10px;
        }
        .menu-btn .dot {
            width: 6px;
            height: 6px;
            background-color: #FCF5EE;
            border-radius: 50%;
        }

        .nav-menu {
            display: none;
            background-color: #B32C43;
            position: absolute;
            top: 65px;
            right: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            padding: 10px;
            min-width: 140px;
            z-index: 99;
        }
        
        .menu-link-btn {
            display: block;
            background-color: #724058;
            color: #FCF5EE;
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            text-decoration: none;
            font-family: 'Big Shoulders Display', sans-serif;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid #FCF5EE;
            text-align: center;
            cursor: pointer;
        }

        #menu-toggle:checked ~ .nav-menu {
            display: block !important;
        }

        .welcome-box {
            background-color: #9EB3D8;
            padding: 20px 15px; 
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            text-align: center;
            box-sizing: border-box;
            width: 100%;
        }
        
        .welcome-box p { 
            margin: 0; 
            font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif-condensed, sans-serif !important;
            font-size: 25px !important; 
            font-weight: 600 !important;
            line-height: 1.35;
            letter-spacing: 0.3px;
            color: #FCF5EE !important;
            display: inline-block;
            transform: scaleX(0.92);
        }

        .cart-section { 
            background-color: #9EB3D8; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            box-sizing: border-box;
            width: 100%;
            color: #FCF5EE !important;
        }
        
        .cart-title-text {
            font-family: 'Great Vibes', cursive !important;
            font-size: 42px !important;
            font-weight: normal !important;
            text-align: center;
            padding: 5px;
            color: #FCF5EE !important;
        }

        .shipping-section {
            margin-top: 15px;
            padding: 10px 5px;
            font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif-condensed, sans-serif !important;
            font-size: 24px !important;
            color: #FCF5EE !important;
        }
        .shipping-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        
        .shipping-section::after {
            content: "";
            display: block;
            border-top: 3px dashed #FCF5EE; 
            margin: 15px 0;
            width: 100%;
        }

        .total-row { 
            display: flex; 
            justify-content: space-between; 
            font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif-condensed, sans-serif !important;
            font-size: 28px !important; 
            font-weight: bold !important; 
            color: #FCF5EE !important; 
        }

        .order-form-box { margin-top: 15px; }
        .form-group { margin-bottom: 12px; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif-condensed, sans-serif !important; font-size: 20px; color: #FCF5EE !important; }
        .form-group label { display: block; margin-bottom: 6px; text-align: left; }
        
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            background-color: #B32C43; 
            color: #FCF5EE !important; 
            border: 1px solid #FCF5EE !important; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 16px; 
        }
        .form-group input::placeholder { color: rgba(252, 245, 238, 0.6) !important; }

        .btn-container { display: flex; justify-content: flex-end; width: 100%; margin-top: 20px; }
        .btn-submit { background-color: #B32C43; color: #FCF5EE; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif-condensed, sans-serif !important; font-size: 22px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="top-banner">
        <div class="left-brand">
            <img src="Naamloos - 03 oktober 2026 om 18.42.59 (1).png" alt="Logo">
            <div class="logo-text">Crea Landa</div>
        </div>
        
        <label for="menu-toggle" class="menu-btn">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </label>
    </div>

    <input type="checkbox" id="menu-toggle">

    <div class="nav-menu">
        <button class="menu-link-btn" onclick="gotoPage('home')">🏠 Home</button>
        <button class="menu-link-btn" onclick="gotoPage('winkelmand')">🛒 Winkelmand</button>
    </div>

    <div class="container">

        <div id="homePage" class="page active">
            <div class="welcome-box">
                <p id="welcome-text-placeholder"></p>
            </div>
            <p style="text-align:center; margin-top: 40px; font-family:'Big Shoulders Display', 'Arial Narrow', sans-serif; font-size:20px; opacity:0.6;">
                (Gebruik het menu rechtsboven om de winkelmand te bekijken)
            </p>
        </div>

        <div id="winkelmandPage" class="page">
            <div class="cart-section">
                <div class="cart-title-text">Mijn Bestelling</div>
                
                <div class="shipping-section">
                    <div class="shipping-row"><span>PostNL Brievenbuspakje:</span><span>€ <span id="txt-postnl">0,00</span></span></div>
                    <div class="shipping-row"><span>DHL Pakje naar huis:</span><span>€ <span id="txt-dhl">0,00</span></span></div>
                    <div class="total-row"><span>Totaalbedrag:</span><span>€ 0,00</span></div>
                </div>

                <div class="order-form-box">
                    <form onsubmit="sendOrder(event)">
                        <div class="form-group"><label>Volledige Naam:</label><input type="text" id="buyerName" placeholder="Voor- en achternaam" required></div>
                        <div class="form-group"><label>Adres (Straat + Huisnummer):</label><input type="text" id="buyerAddress" placeholder="Bijv. Dorpsstraat 1" required></div>
                        <div class="form-group"><label>Postcode & Woonplaats:</label><input type="text" id="buyerCity" placeholder="Bijv. 1234 AB Dorp" required></div>
                        <div class="form-group"><label>Telefoonnummer:</label><input type="text" id="buyerPhone" placeholder="Voor overleg via Tikkie"></div>
                        <div class="btn-container"><button type="submit" class="btn-submit">Bestelling plaatsen</button></div>
                    </form>
                </div>
            </div>
        </div>

<script>

    const KLEUR_BANNER_EN_VAKKEN       = "#9EB3D8";
    const KLEUR_MENU_EN_KNOPPEN        = "#B32C43";
